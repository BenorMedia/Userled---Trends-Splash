<!-- ============================================================
     AI Agents Adoption — Animated Waterfall Chart
     Self-contained (fonts embedded). Paste into a Webflow "Embed" element.
     Animates on scroll-into-view via IntersectionObserver.
     ============================================================ -->
<div class="waterfall-chart" id="waterfallChart">
  <div class="wf-plot">
    <!-- gridlines aligned to the staircase steps (cumulative tops) -->
    <div class="wf-grid">
      <span style="bottom:11%"></span>
      <span style="bottom:38%"></span>
      <span style="bottom:66%"></span>
      <span style="bottom:96%"></span>
      <span style="bottom:100%"></span>
    </div>

    <!-- 100% of orgs cap label -->
    <div class="wf-cap">
      <span class="wf-cap-text">100%<br>of orgs</span>
    </div>

    <!-- bars: each defined by --base (cumulative bottom) and --val (height) -->
    <div class="wf-cols">
      <div class="wf-col" style="--base:0;  --val:11; --delay:0ms;">
        <div class="wf-bar wf-c1"><span class="wf-pct">11%</span></div>
      </div>
      <div class="wf-col" style="--base:11; --val:27; --delay:180ms;">
        <div class="wf-bar wf-c2"><span class="wf-pct">27%</span></div>
      </div>
      <div class="wf-col" style="--base:38; --val:28; --delay:360ms;">
        <div class="wf-bar wf-c3"><span class="wf-pct">28%</span></div>
      </div>
      <div class="wf-col" style="--base:66; --val:30; --delay:540ms;">
        <div class="wf-bar wf-c4"><span class="wf-pct">30%</span></div>
      </div>
      <div class="wf-col" style="--base:96; --val:4;  --delay:720ms;">
        <div class="wf-bar wf-c5"><span class="wf-pct wf-pct-light">4%</span></div>
      </div>
    </div>
  </div>

  <!-- labels row -->
  <div class="wf-labels">
    <div class="wf-label">
      <p class="wf-title">Already deploying<br>AI agents at scale</p>
      <p class="wf-sat wf-s1"><strong>96%</strong> satisfied</p>
    </div>
    <div class="wf-label">
      <p class="wf-title">Ready to scale,<br>infrastructure in place</p>
      <p class="wf-sat wf-s2"><strong>94%</strong> satisfied</p>
    </div>
    <div class="wf-label">
      <p class="wf-title">Piloting in limited<br>use cases</p>
      <p class="wf-sat wf-s3"><strong>77%</strong> satisfied</p>
    </div>
    <div class="wf-label">
      <p class="wf-title">Early exploration,<br>still researching</p>
      <p class="wf-sat wf-s4"><strong>47%</strong> satisfied</p>
    </div>
    <div class="wf-label">
      <p class="wf-title">Not ready,<br>significant barriers</p>
      <p class="wf-sat wf-s5"><strong>48%</strong> satisfied</p>
    </div>
  </div>
</div>

  .waterfall-chart{
    --c1:#0d1424;          /* already deploying  */
    --c2:#0a39c4;          /* ready to scale     */
    --c3:#1668ff;          /* piloting           */
    --c4:#5b6494;          /* early exploration  */
    --c5:#d6d9ec;          /* not ready          */
    --txt-dark:#0d1424;
    --txt-grid:#eceef3;
    --plot-h:440px;
    --ease:cubic-bezier(.22,1,.36,1);

    font-family:'AeonikTrial',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    max-width:1240px;
    margin:0 auto;
    padding:56px 80px 24px 0;   /* extra right room for the "100% of orgs" cap label */
    box-sizing:border-box;
  }
  .waterfall-chart *{box-sizing:border-box;}

  /* ---------- plot ---------- */
  .wf-plot{
    position:relative;
    height:var(--plot-h);
    margin-bottom:18px;
  }
  .wf-grid span{
    position:absolute;
    left:0; right:0;
    height:1px;
    background:var(--txt-grid);
  }
  .wf-cap{
    position:absolute;
    top:0;                          /* top gridline = 100% line */
    left:100%;                      /* sit in the right padding, beside the plot */
    transform:translateY(-50%);
    display:flex; align-items:center; gap:8px;
    white-space:nowrap;
  }
  .wf-cap-bar{
    display:block;
    width:46px; height:9px;
    background:var(--c5);
    border-radius:1px;
  }
  .wf-cap-text{
    font-family:'AeonikTrial',sans-serif;
    font-size:14px; line-height:1.15;
    color:var(--c4); font-weight:400;
  }

  /* ---------- columns ---------- */
  .wf-cols{
    position:absolute; inset:0;
    display:flex;
    align-items:flex-end;
  }
  .wf-col{
    flex:1;
    height:100%;
    position:relative;
    padding:0 14px;
  }
  .wf-bar{
    position:absolute;
    left:14px; right:14px;
    bottom:calc(var(--base) * 1%);
    height:0;                              /* start collapsed */
    border-radius:2px;
    cursor:initial;
    transition:height .9s var(--ease), background-color .25s ease;
    transition-delay:var(--delay), 0s;
  }
  .waterfall-chart.is-visible .wf-bar{
    height:calc(var(--val) * 1%);
  }

  .wf-c1{background:var(--c1);}
  .wf-c2{background:var(--c2);}
  .wf-c3{background:var(--c3);}
  .wf-c4{background:var(--c4);}
  .wf-c5{background:var(--c5);}

  /* darker shades on hover */
  .wf-c1:hover{background:#05080f;}
  .wf-c2:hover{background:#072a92;}
  .wf-c3:hover{background:#0d4fcc;}
  .wf-c4:hover{background:#464d76;}
  .wf-c5:hover{background:#b9bdd8;}

  /* percentage label above each bar — Canela Deck */
  .wf-pct{
    position:absolute;
    bottom:100%;
    left:50%;
    transform:translate(-50%,6px);
    margin-bottom:8px;
    font-family:'CanelaDeckTrial',Georgia,serif;
    font-size:46px;
    font-weight:500;
    letter-spacing:-.01em;
    color:var(--txt-dark);
    white-space:nowrap;
    opacity:0;
    transition:opacity .5s ease, transform .5s var(--ease);
    transition-delay:calc(var(--delay) + .35s);
  }
  .wf-pct-light{color:var(--c4);font-weight:400;}
  .waterfall-chart.is-visible .wf-pct{
    opacity:1;
    transform:translate(-50%,0);
  }
  .wf-c2 .wf-pct{color:var(--c2);}
  .wf-c3 .wf-pct{color:var(--c3);}

  /* ---------- labels ---------- */
  .wf-labels{display:flex;}
  .wf-label{flex:1;padding:0 14px;}
  .wf-title{
    margin:0 0 14px;
    font-family:'AeonikTrial',sans-serif;
    font-size:0.85rem;
    line-height:1.35;
    color:var(--txt-dark);
    font-weight:400;
  }
  .wf-sat{
    margin:0;
    font-family:'AeonikTrial',sans-serif;
    font-size:15px;
    color:var(--txt-dark);
    opacity:0;
    transform:translateY(8px);
    transition:opacity .5s ease, transform .5s var(--ease);
  }
  .wf-sat strong{
    font-family:'CanelaDeckTrial',Georgia,serif;
    font-size:24px;
    font-weight:500;
    margin-right:2px;
  }
  .waterfall-chart.is-visible .wf-sat{opacity:1;transform:translateY(0);}
  .wf-s1{transition-delay:.45s;}  .wf-s1 strong{color:var(--c1);}
  .wf-s2{transition-delay:.63s;}  .wf-s2{color:var(--c2);}  .wf-s2 strong{color:var(--c2);}
  .wf-s3{transition-delay:.81s;}  .wf-s3{color:var(--c3);}  .wf-s3 strong{color:var(--c3);}
  .wf-s4{transition-delay:.99s;}  .wf-s4{color:var(--c4);}  .wf-s4 strong{color:var(--c4);}
  .wf-s5{transition-delay:1.17s;} .wf-s5{color:var(--c5);}  .wf-s5 strong{color:var(--c5);}

  /* ---------- responsive ---------- */

  /* tablet */
  @media(max-width:960px){
    .waterfall-chart{--plot-h:340px; padding:40px 70px 24px 0;}
    .wf-pct{font-size:32px;}
    .wf-title{font-size:0.78rem;}
    .wf-sat{font-size:13px;}
    .wf-sat strong{font-size:20px;}
    .wf-col,.wf-label{padding:0 8px;}
    .wf-bar{left:8px;right:8px;}
    .wf-cap-text{font-size:12px;}
  }

  /* mobile — horizontal scroll, no animation */
  @media(max-width:768px){
    .waterfall-chart{
      --plot-h:300px;
      padding:40px 0 24px;
      overflow-x:auto;
      overflow-y:visible;
      -webkit-overflow-scrolling:touch;
    }
    .waterfall-chart::-webkit-scrollbar{height:4px;}
    .waterfall-chart::-webkit-scrollbar-track{background:#f1f1f1;border-radius:2px;}
    .waterfall-chart::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:2px;}

    /* wrap plot + labels in a single scrollable row so they stay aligned */
    .waterfall-chart{display:flex;flex-direction:column;}
    .wf-plot{
      min-width:600px;
      width:600px;
      margin:0 0 18px;
      align-self:flex-start;
      padding:0 24px;
      box-sizing:border-box;
    }
    .wf-labels{
      min-width:600px;
      width:600px;
      align-self:flex-start;
      padding:0 24px;
      box-sizing:border-box;
    }
    /* cols and labels both use flex:1 so they divide the same 600px equally */
    .wf-cols{position:absolute;inset:0;}
    .wf-col,.wf-label{padding:0 6px;}
    .wf-bar{left:6px;right:6px;}
    .wf-pct{font-size:24px;}
    .wf-title{font-size:0.72rem;}
    .wf-sat{font-size:11px;}
    .wf-sat strong{font-size:16px;}
    .wf-cap-text{font-size:10px;}
    /* skip animation on mobile — show final state immediately */
    .wf-bar{height:calc(var(--val) * 1%) !important;transition:none !important;}
    .wf-pct{opacity:1 !important;transform:translate(-50%,0) !important;transition:none !important;}
    .wf-sat{opacity:1 !important;transform:translateY(0) !important;transition:none !important;}
  }
</style>

<script>
  (function(){
    var chart = document.getElementById('waterfallChart');
    if(!chart) return;
    function reveal(){ chart.classList.add('is-visible'); }
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if(e.isIntersecting){ reveal(); io.disconnect(); }
        });
      }, { threshold: 0.35 });
      io.observe(chart);
    } else { reveal(); }
  })();
</script>

<script>
  // Send content height to parent so iframe can resize dynamically
  function sendHeight(){
    var h = document.documentElement.scrollHeight || document.body.scrollHeight;
    window.parent.postMessage({ type: 'iframeHeight', height: h }, '*');
  }
  // Send on load
  window.addEventListener('load', sendHeight);
  // Send on resize
  window.addEventListener('resize', sendHeight);
  // Send after animation completes (give extra buffer)
  setTimeout(sendHeight, 1800);
</script>
